<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Chung Cặp Đôi - LoveMore</title>
  <!-- Favicon icon trên tab -->
  <link rel="icon" type="image/jpeg" href="https://duavamew.asia/photo/logo2.png">
  
  <!-- THẺ PREVIEW LINK (OPEN GRAPH CHO FACEBOOK/MESSENGER) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Không Gian Chung Cặp Đôi ♡౨ৎ☆">
  <meta property="og:description" content="Không gian chung cho cặp đôi và ghi chú ngọt ngào dành riêng cho hai chúng mình.">
  <meta property="og:image" content="https://duavamew.asia/photo/banner.png">
  <meta property="og:image:secure_url" content="https://duavamew.asia/photo/banner.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://duavamew.asia/">
  <meta property="fb:app_id" content="966242223397117">
  <!-- Liên kết file Manifest -->
  <link rel="manifest" href="https://duavamew.asia/manifest.json">

  <!-- Thẻ tối ưu riêng cho iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LoveMore - Hiểu Nhau Hơn">

  <!-- Biểu tượng ứng dụng trên màn hình chính iPhone -->
  <link rel="apple-touch-icon" href="https://duavamew.asia/photo/logoapp.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #f7a8ca 0%, #f7c5e6 40%, #fad0c4 70%, #ffd1ff 100%);
      background-attachment: fixed;
      color: #334155;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 1rem;
    }
    .glass-auth-box {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 35px;
      box-shadow: 0 20px 40px rgba(224, 38, 128, 0.25);
      width: 100%;
      max-width: 420px;
      margin: auto;
    }
    .register-fields {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease;
    }
    .register-fields.show {
      max-height: 250px;
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- FORM ĐĂNG NHẬP / ĐĂNG KÝ -->
  <div class="glass-auth-box p-6 sm:p-8 my-auto">
    <div class="text-center mb-5">
      <div class="w-14 h-14 bg-white text-pink-600 rounded-full flex items-center justify-center text-xl mx-auto mb-2.5 shadow-md border-2 border-pink-200">
        <i class="fa-solid fa-heart-pulse"></i>
      </div>
      <h2 id="authTitle" class="text-xl sm:text-2xl font-black text-slate-800">Đăng Nhập Lịch Chung</h2>
      <p class="text-xs text-slate-600 mt-0.5">Kết nối không gian lịch cá nhân của hai bạn</p>
    </div>

    <div class="space-y-3.5">
      <!-- TÊN TÀI KHOẢN -->
      <div>
        <label class="block text-xs font-black text-pink-700 uppercase mb-1">Tên tài khoản</label>
        <input type="text" id="authUsername" placeholder="Nhập tên tài khoản..." class="w-full p-3 bg-white/80 border border-white rounded-2xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-pink-400 shadow-sm" />
      </div>

      <!-- Ô GMAIL (CHỈ HIỆN KHI ĐĂNG KÝ) -->
      <div id="gmailGroup" class="register-fields">
        <label class="block text-xs font-black text-pink-700 uppercase mb-1">Địa chỉ Gmail</label>
        <input type="email" id="authGmail" placeholder="VD: duavamew@gmail.com" class="w-full p-3 bg-white/80 border border-white rounded-2xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-pink-400 shadow-sm" />
      </div>

      <!-- MẬT KHẨU (CÓ MẮT TẮT/BẬT) -->
      <div>
        <label class="block text-xs font-black text-pink-700 uppercase mb-1">Mật khẩu</label>
        <div class="relative">
          <input type="password" id="authPassword" maxlength="15" placeholder="Nhập mật khẩu (3-15 ký tự)..." class="w-full p-3 pr-10 bg-white/80 border border-white rounded-2xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-pink-400 shadow-sm" />
          <button type="button" onclick="togglePasswordVisibility('authPassword', 'eyeIcon1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-pink-600 focus:outline-none p-1">
            <i id="eyeIcon1" class="fa-solid fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <!-- NHẬP LẠI MẬT KHẨU (CÓ MẮT TẮT/BẬT, CHỈ HIỆN KHI ĐĂNG KÝ) -->
      <div id="confirmPasswordGroup" class="register-fields">
        <label class="block text-xs font-black text-pink-700 uppercase mb-1">Nhập lại mật khẩu</label>
        <div class="relative">
          <input type="password" id="authConfirmPassword" maxlength="15" placeholder="Nhập lại mật khẩu..." class="w-full p-3 pr-10 bg-white/80 border border-white rounded-2xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-pink-400 shadow-sm" />
          <button type="button" onclick="togglePasswordVisibility('authConfirmPassword', 'eyeIcon2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-pink-600 focus:outline-none p-1">
            <i id="eyeIcon2" class="fa-solid fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <button onclick="handleAuth()" id="authSubmitBtn" class="w-full py-3.5 bg-pink-600 hover:bg-pink-700 text-white font-black rounded-2xl shadow-lg shadow-pink-300 transition-all text-sm mt-2">
        Đăng Nhập Ngay
      </button>

      <div class="text-center mt-3">
        <button onclick="toggleAuthMode()" id="authSwitchText" class="text-xs font-black text-pink-700 hover:underline">
          Chưa có tài khoản? Đăng ký ngay
        </button>
      </div>
    </div>
  </div>

  <!-- CUSTOM MODAL THÔNG BÁO GLASSMORPHISM -->
  <div id="customModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-white text-center transform scale-95 transition-transform duration-300" id="modalContentBox">
      <div id="modalIcon" class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-xl mx-auto mb-3 shadow-inner">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h3 id="modalTitle" class="text-lg font-black text-slate-800 mb-1">Thành công!</h3>
      <p id="modalMessage" class="text-xs font-semibold text-slate-600 mb-6">Thao tác thành công!</p>
      <button onclick="closeCustomModal()" class="w-full py-3 bg-pink-600 hover:bg-pink-700 text-white font-black rounded-2xl shadow-md text-xs tracking-wider uppercase transition-all">
        OK
      </button>
    </div>
  </div>

  <!-- FIREBASE AUTH SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://lichcuatui-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch(e) {
      console.warn("Lỗi khởi tạo Firebase", e);
    }

    let isRegisterMode = false;
    let nextAction = null;

    // BẬT / TẮT HIỂN THỊ MẬT KHẨU (CON MẮT)
    window.togglePasswordVisibility = function(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      }
    };

    // CHUYỂN ĐỔI GIỮA ĐĂNG NHẬP / ĐĂNG KÝ
    window.toggleAuthMode = function() {
      isRegisterMode = !isRegisterMode;
      const gmailGroup = document.getElementById('gmailGroup');
      const confirmGroup = document.getElementById('confirmPasswordGroup');

      if (isRegisterMode) {
        document.getElementById('authTitle').innerText = "Đăng Ký Tài Khoản Mới";
        document.getElementById('authSubmitBtn').innerText = "Đăng Ký Ngay";
        document.getElementById('authSwitchText').innerText = "Đã có tài khoản? Đăng nhập";
        gmailGroup.classList.add('show');
        confirmGroup.classList.add('show');
      } else {
        document.getElementById('authTitle').innerText = "Đăng Nhập Lịch Chung";
        document.getElementById('authSubmitBtn').innerText = "Đăng Nhập Ngay";
        document.getElementById('authSwitchText').innerText = "Chưa có tài khoản? Đăng ký ngay";
        gmailGroup.classList.remove('show');
        confirmGroup.classList.remove('show');
      }
    };

    function showModal(title, message, isSuccess = true, callback = null) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerText = message;
      
      const iconDiv = document.getElementById('modalIcon');
      if(isSuccess) {
        iconDiv.className = "w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-xl mx-auto mb-3 shadow-inner";
        iconDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
      } else {
        iconDiv.className = "w-14 h-14 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-xl mx-auto mb-3 shadow-inner";
        iconDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
      }

      nextAction = callback;
      const modal = document.getElementById('customModal');
      const box = document.getElementById('modalContentBox');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      box.classList.remove('scale-95');
    }

    window.closeCustomModal = function() {
      const modal = document.getElementById('customModal');
      const box = document.getElementById('modalContentBox');
      modal.classList.add('opacity-0', 'pointer-events-none');
      box.classList.add('scale-95');

      if (typeof nextAction === 'function') {
        nextAction();
        nextAction = null;
      }
    };

    // KIỂM TRA ĐIỀU KIỆN ĐĂNG KÝ / ĐĂNG NHẬP
    window.handleAuth = async function() {
      const user = document.getElementById('authUsername').value.trim();
      const pass = document.getElementById('authPassword').value.trim();
      
      if(!user || !pass) {
        showModal("Thiếu thông tin", "Vui lòng nhập đầy đủ tên tài khoản và mật khẩu!", false);
        return;
      }

      if (!db) {
        showModal("Lỗi kết nối", "Chưa kết nối được Firebase!", false);
        return;
      }

      const userRef = ref(db, `users/${user}`);
      
      try {
        const snapshot = await get(userRef);
        
        if (isRegisterMode) {
          const gmail = document.getElementById('authGmail').value.trim();
          const confirmPass = document.getElementById('authConfirmPassword').value.trim();

          // 1. Kiểm tra định dạng Gmail có chứa @ và hợp lệ
          const gmailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if(!gmail || !gmail.includes('@') || !gmailRegex.test(gmail)) {
            showModal("Gmail không hợp lệ", "Vui lòng nhập đúng định dạng Gmail (phải có ký tự @ và tên miền, ví dụ: name@gmail.com)!", false);
            return;
          }

          // 2. Kiểm tra quy tắc mật khẩu
          if (pass.length < 3 || pass.length > 15) {
            showModal("Mật khẩu không hợp lệ", "Mật khẩu phải từ 3 đến 15 ký tự!", false);
            return;
          }
          if (!/[A-Z]/.test(pass)) {
            showModal("Mật khẩu không hợp lệ", "Mật khẩu phải chứa ít nhất 1 chữ cái viết hoa (A-Z)!", false);
            return;
          }
          if (!/[!@#$%^&*(),.?":{}|<>\-_=+\\|[\]{};:'",.<>/?]/.test(pass)) {
            showModal("Mật khẩu không hợp lệ", "Mật khẩu phải chứa ít nhất 1 ký tự đặc biệt (VD: @, #, $, !, %...)!", false);
            return;
          }

          // 3. Kiểm tra mật khẩu khớp
          if(pass !== confirmPass) {
            showModal("Mật khẩu không khớp", "Mật khẩu nhập lại không trùng khớp, vui lòng kiểm tra lại!", false);
            return;
          }

          // 4. Kiểm tra tài khoản tồn tại
          if (snapshot.exists()) {
            showModal("Trùng tài khoản", "Tài khoản này đã tồn tại, vui lòng chọn tên khác!", false);
          } else {
            const newUser = { 
              username: user, 
              password: pass, 
              gmail: gmail,
              nickname: user, 
              roomCode: user + '_room' 
            };
            await set(userRef, newUser);
            
            // Lưu thông tin tạm để tự điền sau khi load lại trang
            sessionStorage.setItem('JUST_REGISTERED', JSON.stringify({ user, pass }));
            
            // Reload lại trang web
            location.reload();
          }
        } else {
          // ĐĂNG NHẬP
          if (!snapshot.exists()) {
            showModal("Không tìm thấy", "Tài khoản không tồn tại!", false);
          } else {
            const userData = snapshot.val();
            if (userData.password !== pass) {
              showModal("Sai mật khẩu", "Mật khẩu bạn nhập không chính xác!", false);
            } else {
              localStorage.setItem('COUPLE_CALENDAR_USER', JSON.stringify(userData));
              
              showModal("Đăng nhập thành công!", "Chào mừng hai bạn quay trở lại với không gian lịch chung.", true, () => {
                window.location.href = "lich.html";
              });
            }
          }
        }
      } catch (error) {
        console.error(error);
        showModal("Lỗi hệ thống", "Lỗi kết nối cơ sở dữ liệu!", false);
      }
    };

    // KIỂM TRA TỰ ĐỘNG ĐIỀN TÀI KHOẢN SAU KHI RELOAD
    window.addEventListener('DOMContentLoaded', () => {
      const justRegistered = sessionStorage.getItem('JUST_REGISTERED');
      if (justRegistered) {
        try {
          const { user, pass } = JSON.parse(justRegistered);
          sessionStorage.removeItem('JUST_REGISTERED');
          
          document.getElementById('authUsername').value = user || '';
          document.getElementById('authPassword').value = pass || '';
          
          showModal("Đăng ký thành công!", "Tài khoản đã được tạo thành công! Thông tin đăng nhập đã được tự động điền sẵn, bạn chỉ cần nhấn 'Đăng Nhập Ngay'.", true);
        } catch(e) {
          console.error("Lỗi đọc dữ liệu đăng ký:", e);
        }
      }
    });
  </script>
</body>
</html>
