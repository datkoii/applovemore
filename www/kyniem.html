  <style>
    body {
      font-family: 'Nunito', sans-serif;

      background-attachment: fixed;
      color: #334155;
      min-height: 100vh;
      overflow-x: hidden;

    /* GLASSMORPHISM NAV */
    .glass-nav {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
    }

    /* GLASSMORPHISM CARDS */
    .glass-card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);

    /* BẢNG CHỌN NGÀY CUSTOM GLASSMORPHISM POPUP */

    /* TOAST ANIMATION */

    @keyframes slideDown {
      from { opacity: 0; transform: translate(-50%, -20px) scale(0.95); }

    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://lichcuatui-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    let db = null;
    try { db = getDatabase(initializeApp(firebaseConfig)); } catch(e){}

    let currentUser = JSON.parse(localStorage.getItem('COUPLE_CALENDAR_USER'));
    if(!currentUser) window.location.href = "index.html";

    const isBoy = currentUser.role === 'Boy';
    document.getElementById('loverBirthdayTitle').innerText = isBoy ? "Sinh Nhật Em" : "Sinh Nhật Anh";

    /* ======================================================== */
    /* BẢNG CHỌN NGÀY TÍCH HỢP CHỌN NHANH THÁNG/NĂM              */
    /* ======================================================== */
    let dpTargetInputId = null;
    let dpCurrentDate = new Date();
    let dpSelectedIso = '';

    window.openCustomDatePicker = function(inputId) {
      dpTargetInputId = inputId;
      const val = document.getElementById(inputId).getAttribute('data-iso') || '';
      if (val) {
        dpCurrentDate = new Date(val);
        dpSelectedIso = val;
      } else {
        dpCurrentDate = new Date();
        dpSelectedIso = '';
      }
      toggleDpQuickPicker(false); // Mặc định về lại Lịch xem ngày
      renderCustomDatePicker();
      document.getElementById('customDatePickerModal').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('dpModalBox').classList.remove('scale-95');
    };

    window.closeCustomDatePicker = function() {
      document.getElementById('customDatePickerModal').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('dpModalBox').classList.add('scale-95');
    };

    window.changeDpMonth = function(offset) {
      dpCurrentDate.setMonth(dpCurrentDate.getMonth() + offset);
      renderCustomDatePicker();
    };

    // CHUYỂN ĐỔI QUA LẠI GIỮA LỊCH NGÀY VÀ BẢNG CHỌN NHANH THÁNG/NĂM
    window.toggleDpQuickPicker = function(showQuick) {
      const calView = document.getElementById('dpCalendarView');
      const quickView = document.getElementById('dpQuickPickerView');

      if (showQuick) {
        calView.classList.add('hidden');
        quickView.classList.remove('hidden');
        populateDpQuickPicker();
      } else {
        quickView.classList.add('hidden');
        calView.classList.remove('hidden');
        renderCustomDatePicker();
      }
    };

    function populateDpQuickPicker() {
      const yearSelect = document.getElementById('dpYearSelect');
      yearSelect.innerHTML = '';
      const currentY = dpCurrentDate.getFullYear();

      // Sinh danh sách các năm từ 1970 đến 2035
      for (let y = 1970; y <= 2035; y++) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.innerText = `Năm ${y}`;
        if (y === currentY) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      const monthsGrid = document.getElementById('dpMonthsGrid');
      monthsGrid.innerHTML = '';
      const currentM = dpCurrentDate.getMonth();

      // Sinh 12 nút bấm tháng
      for (let m = 0; m < 12; m++) {
        const btn = document.createElement('button');
        const isSelected = (m === currentM);
        btn.className = `py-2 rounded-xl text-xs font-black transition-all ${
          isSelected
            ? 'bg-pink-600 text-white shadow-md scale-105'
            : 'bg-white hover:bg-pink-100 text-slate-700 hover:text-pink-600 border border-slate-200'
        }`;
        btn.innerText = `Tháng ${m + 1}`;
        btn.onclick = () => {
          dpCurrentDate.setMonth(m);
          toggleDpQuickPicker(false); // Chọn xong tháng tự nhảy lại xem lịch ngày
        };
        monthsGrid.appendChild(btn);
      }
    }

    window.changeDpQuickYear = function(offset) {
      dpCurrentDate.setFullYear(dpCurrentDate.getFullYear() + offset);
      populateDpQuickPicker();
    };

    window.onDpYearSelectChange = function() {
      const yearSelect = document.getElementById('dpYearSelect');
      dpCurrentDate.setFullYear(parseInt(yearSelect.value));
      populateDpQuickPicker();
    };

    function renderCustomDatePicker() {
      const year = dpCurrentDate.getFullYear();
      const month = dpCurrentDate.getMonth();
      
      document.getElementById('dpMonthYearText').innerHTML = `THÁNG ${month + 1}, ${year} <i class="fa-solid fa-caret-down text-pink-500 text-xs ml-0.5"></i>`;

      const grid = document.getElementById('dpDaysGrid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1);
      let dayOfWeek = firstDay.getDay() - 1;
      if (dayOfWeek === -1) dayOfWeek = 6;

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();

      for (let i = dayOfWeek - 1; i >= 0; i--) {
        const cell = document.createElement('div');
        cell.className = "py-1.5 text-xs font-bold text-slate-300 pointer-events-none";
        cell.innerText = prevMonthDays - i;
        grid.appendChild(cell);
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= daysInMonth; day++) {
        const mStr = (month + 1) < 10 ? `0${month + 1}` : `${month + 1}`;
        const dStr = day < 10 ? `0${day}` : `${day}`;
        const iso = `${year}-${mStr}-${dStr}`;

        const cell = document.createElement('button');
        let baseClass = "py-1.5 text-xs font-black rounded-xl transition-all cursor-pointer flex items-center justify-center ";

        if (iso === dpSelectedIso) {
          baseClass += "bg-pink-600 text-white shadow-md shadow-pink-300 scale-105";
        } else if (iso === todayStr) {
          baseClass += "border-2 border-pink-400 text-pink-600 bg-pink-50 hover:bg-pink-100";
        } else {
          baseClass += "text-slate-700 hover:bg-pink-100 hover:text-pink-600";
        }

        cell.className = baseClass;
        cell.innerText = day;
        cell.onclick = () => selectDpDate(iso, `${dStr}/${mStr}/${year}`);
        grid.appendChild(cell);
      }
    }

    function selectDpDate(iso, formatted) {
      if (!dpTargetInputId) return;
      const input = document.getElementById(dpTargetInputId);
      input.value = formatted;
      input.setAttribute('data-iso', iso);
      closeCustomDatePicker();
    }

    window.selectDpToday = function() {
      const today = new Date();
      const y = today.getFullYear();
      const m = (today.getMonth() + 1) < 10 ? `0${today.getMonth() + 1}` : `${today.getMonth() + 1}`;
      const d = today.getDate() < 10 ? `0${today.getDate()}` : `${today.getDate()}`;
      selectDpDate(`${y}-${m}-${d}`, `${d}/${m}/${y}`);
    };

    window.clearDpValue = function() {
      if (dpTargetInputId) {
        const input = document.getElementById(dpTargetInputId);
        input.value = '';
        input.removeAttribute('data-iso');
      }
      closeCustomDatePicker();
    };

    /* ======================================================== */
    /* LOGIC THÔNG BÁO POPUP & FIREBASE DB                      */
    /* ======================================================== */
    window.showToast = function(title, message, type = 'success') {
      const toast = document.getElementById('customToast');
      const toastTitle = document.getElementById('toastTitle');
      const toastMessage = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');
      const toastIconBg = document.getElementById('toastIconBg');

      toastTitle.innerText = title;
      toastMessage.innerText = message;

      if(type === 'success') {
        toastIconBg.className = "w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg shrink-0";
        toastIcon.className = "fa-solid fa-circle-check";
      } else if(type === 'warning') {
        toastIconBg.className = "w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg shrink-0";
        toastIcon.className = "fa-solid fa-triangle-exclamation";
      } else {
        toastIconBg.className = "w-10 h-10 rounded-xl bg-pink-100 text-pink-600 flex items-center justify-center text-lg shrink-0";
        toastIcon.className = "fa-solid fa-heart";
      }

      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('toast-enter');

      setTimeout(() => { hideToast(); }, 3200);
    };

    window.hideToast = function() {
      const toast = document.getElementById('customToast');
      toast.classList.add('opacity-0', 'pointer-events-none');
      toast.classList.remove('toast-enter');
    };

    function setFormattedDateToInput(inputId, isoDate) {
      if (!isoDate) return;
      const parts = isoDate.split('-');
      if (parts.length === 3) {
        const formatted = `${parts[2]}/${parts[1]}/${parts[0]}`;
        const input = document.getElementById(inputId);
        input.value = formatted;
        input.setAttribute('data-iso', isoDate);
      }
    }

    function loadData() {
      if(!db || !currentUser.roomCode) return;

      const roomAnniversariesRef = ref(db, `rooms/${currentUser.roomCode}/anniversaries`);
      
      onValue(roomAnniversariesRef, (snapshot) => {
        const data = snapshot.val() || {};

        if (data.loveStartDate) {
          setFormattedDateToInput('loveStartDateInput', data.loveStartDate);
          calculateLoveDays(data.loveStartDate);
        }

        if (isBoy) {
          if(data.boyBirthday) setFormattedDateToInput('myBirthdayInput', data.boyBirthday);
          if(data.boyBirthdayNote) document.getElementById('myBirthdayNote').value = data.boyBirthdayNote;
          if(data.girlBirthday) setFormattedDateToInput('loverBirthdayInput', data.girlBirthday);
          if(data.girlBirthdayNote) document.getElementById('loverBirthdayNote').value = data.girlBirthdayNote;
        } else {
          if(data.girlBirthday) setFormattedDateToInput('myBirthdayInput', data.girlBirthday);
          if(data.girlBirthdayNote) document.getElementById('myBirthdayNote').value = data.girlBirthdayNote;
          if(data.boyBirthday) setFormattedDateToInput('loverBirthdayInput', data.boyBirthday);
          if(data.boyBirthdayNote) document.getElementById('loverBirthdayNote').value = data.boyBirthdayNote;
        }
      });
    }

    function calculateLoveDays(startDateStr) {
      const start = new Date(startDateStr);
      const today = new Date();
      const diffTime = Math.abs(today - start);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      document.getElementById('loveDaysCounter').innerText = `${diffDays} NGÀY`;
      document.getElementById('loveStartDateText').innerText = `Từ ngày: ${startDateStr.split('-').reverse().join('/')}`;
    }

    window.saveLoveDate = function() {
      const isoVal = document.getElementById('loveStartDateInput').getAttribute('data-iso');
      if(!isoVal) {
        showToast("Thiếu thông tin", "Vui lòng chọn ngày bắt đầu yêu nhau!", "warning");
        return;
      }
      if(db && currentUser.roomCode) {
        set(ref(db, `rooms/${currentUser.roomCode}/anniversaries/loveStartDate`), isoVal);
        showToast("Đã lưu thành công!", "Ngày kỷ niệm yêu nhau đã đồng bộ cho cả hai bạn! ❤️", "love");
      }
    };

    window.saveMyBirthday = function() {
      const isoVal = document.getElementById('myBirthdayInput').getAttribute('data-iso');
      const noteVal = document.getElementById('myBirthdayNote').value;

      if(!isoVal) {
        showToast("Thiếu thông tin", "Vui lòng chọn ngày sinh nhật của bạn!", "warning");
        return;
      }

      if(db && currentUser.roomCode) {
        const keyPrefix = isBoy ? 'boy' : 'girl';
        set(ref(db, `rooms/${currentUser.roomCode}/anniversaries/${keyPrefix}Birthday`), isoVal);
        set(ref(db, `rooms/${currentUser.roomCode}/anniversaries/${keyPrefix}BirthdayNote`), noteVal);
        showToast("Lưu thành công!", "Thông tin sinh nhật của bạn đã cập nhật cho đối phương thấy! 🎂", "success");
      }
    };

    window.saveLoverBirthday = function() {
      const isoVal = document.getElementById('loverBirthdayInput').getAttribute('data-iso');
      const noteVal = document.getElementById('loverBirthdayNote').value;

      if(!isoVal) {
        showToast("Thiếu thông tin", "Vui lòng chọn ngày sinh nhật của người ấy!", "warning");
        return;
      }

      if(db && currentUser.roomCode) {
        const keyPrefix = isBoy ? 'girl' : 'boy';
        set(ref(db, `rooms/${currentUser.roomCode}/anniversaries/${keyPrefix}Birthday`), isoVal);
        set(ref(db, `rooms/${currentUser.roomCode}/anniversaries/${keyPrefix}BirthdayNote`), noteVal);
        showToast("Lưu thành công!", "Đã ghi nhận sinh nhật và gợi ý quà tặng cho đối phương! 🎁", "success");
      }
    };

    loadData();
  </script>
</body>
</html>
